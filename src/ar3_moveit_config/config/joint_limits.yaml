# MoveIt joint limits (override/augment the URDF). Position limits come from the
# URDF, which takes them from config/robot.yaml.
# The default velocity/acceleration scaling factors below are overridden at
# launch from config/robot.yaml `motion:` (SPEC §10: change defaults in config).
default_velocity_scaling_factor: 0.2
default_acceleration_scaling_factor: 0.2

joint_limits:
  joint_1: {has_velocity_limits: true, max_velocity: 1.0472, has_acceleration_limits: true, max_acceleration: 0.5236}  # 60 deg/s, 30 deg/s^2
  joint_2: {has_velocity_limits: true, max_velocity: 1.0472, has_acceleration_limits: true, max_acceleration: 0.5236}
  joint_3: {has_velocity_limits: true, max_velocity: 1.0472, has_acceleration_limits: true, max_acceleration: 0.5236}
  joint_4: {has_velocity_limits: true, max_velocity: 1.0472, has_acceleration_limits: true, max_acceleration: 0.5236}
  joint_5: {has_velocity_limits: true, max_velocity: 1.0472, has_acceleration_limits: true, max_acceleration: 0.5236}
  joint_6: {has_velocity_limits: true, max_velocity: 1.0472, has_acceleration_limits: true, max_acceleration: 0.5236}
  gripper_jaw1_joint: {has_velocity_limits: true, max_velocity: 0.05, has_acceleration_limits: true, max_acceleration: 0.1}
  gripper_jaw2_joint: {has_velocity_limits: true, max_velocity: 0.05, has_acceleration_limits: true, max_acceleration: 0.1}
