# ros2_control controllers for mock and sim. Position interface only (SPEC §4).
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/GripperActionController

joint_trajectory_controller:
  ros__parameters:
    joints: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 0.5
      joint_1: {trajectory: 0.2, goal: 0.02}
      joint_2: {trajectory: 0.2, goal: 0.02}
      joint_3: {trajectory: 0.2, goal: 0.02}
      joint_4: {trajectory: 0.2, goal: 0.02}
      joint_5: {trajectory: 0.2, goal: 0.02}
      joint_6: {trajectory: 0.2, goal: 0.02}

gripper_controller:
  ros__parameters:
    joint: gripper_jaw1_joint
    goal_tolerance: 0.002
    allow_stalling: true
    stall_timeout: 1.0
