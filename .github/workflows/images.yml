# The dev and vnc images must build for both arches (no push). The slowest jobs by far (arm64 runs
# under QEMU), so they run only when the image inputs change: the build copies nothing from
# outside docker/.
name: images
on:
  push:
    paths:
      - "docker/**"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "docker/**"
      - ".github/workflows/images.yml"

# A newer push to the same branch replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [dev, vnc]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: false
