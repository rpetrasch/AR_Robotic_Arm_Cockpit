openapi: 3.0.3
info:
  title: AR3 Cockpit API
  version: 0.1.0
paths:
  /api/alerts:
    get:
      operationId: alerts_list
      description: |-
        GET: alerts (``status`` open | active | acknowledged | resolved | all, ``severity``,
        ``rule``, ``limit``). POST: acknowledge several (``ids``, ``comment``).
      tags:
      - alerts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: alerts_create
      description: |-
        GET: alerts (``status`` open | active | acknowledged | resolved | all, ``severity``,
        ``rule``, ``limit``). POST: acknowledge several (``ids``, ``comment``).
      tags:
      - alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckManyRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AckManyRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AckManyRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/alerts/{alert_id}/ack:
    post:
      operationId: alerts_ack_create
      parameters:
      - in: path
        name: alert_id
        schema:
          type: integer
        required: true
      tags:
      - alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AckRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AckRequestRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/alerts/rules:
    get:
      operationId: alerts_rules_retrieve
      description: The rules of config/cockpit/alerts.yaml.
      tags:
      - alerts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/arm/disarm:
    post:
      operationId: arm_disarm_create
      tags:
      - arm
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/arm/joints:
    get:
      operationId: arm_joints_retrieve
      description: The measured joint angles, for the pre-flight pose check (§9.4
        step 5).
      tags:
      - arm
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/arm/preflight/{step}:
    post:
      operationId: arm_preflight_create
      description: |-
        One pre-flight action (§9.4); ``step`` = devices | estop | workspace | homing | pose |
        limits | arm. Every call is audited with the user.
      parameters:
      - in: path
        name: step
        schema:
          type: string
        required: true
      tags:
      - arm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreflightRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PreflightRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PreflightRequestRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/arm/state:
    get:
      operationId: arm_state_retrieve
      tags:
      - arm
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/arm/stop:
    post:
      operationId: arm_stop_create
      description: 'The header''s software stop (§7.2): cancel every goal, hold. Not
        an e-stop.'
      tags:
      - arm
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/audit:
    get:
      operationId: audit_retrieve
      description: 'Newest first. Query: limit (≤ 500), offset, actor, action (prefix).'
      tags:
      - audit
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
          description: ''
  /api/auth/login:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/auth/me:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/auth/password:
    post:
      operationId: auth_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/cameras:
    get:
      operationId: cameras_retrieve
      tags:
      - cameras
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/cameras/{name}/thumb:
    get:
      operationId: cameras_thumb_retrieve
      description: The latest thumbnail (JPEG, ≤ 5 new ones a second, made by the
        agent).
      parameters:
      - in: path
        name: name
        schema:
          type: string
        required: true
      tags:
      - cameras
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          description: ''
  /api/checks:
    get:
      operationId: checks_retrieve
      description: The checklist with the last results (runs all checks on the first
        call).
      tags:
      - checks
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/checks/run:
    post:
      operationId: checks_run_create
      description: Re-check all (no ids) or the given checks; returns the whole checklist.
      tags:
      - checks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunChecksRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RunChecksRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RunChecksRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/components:
    get:
      operationId: components_retrieve
      description: |-
        The catalogue (§3.4) with live status and whether each runs in the current mode
        (``?mode=<id>`` previews another mode for the diagram).
      tags:
      - components
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/env/components/{component_id}/restart:
    post:
      operationId: env_components_restart_create
      description: 'Restart a container component: the stack container, or (re)start
        Lichtblick web.'
      parameters:
      - in: path
        name: component_id
        schema:
          type: string
        required: true
      tags:
      - env
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/env/health:
    get:
      operationId: env_health_retrieve
      tags:
      - env
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/env/modes:
    get:
      operationId: env_modes_retrieve
      description: |-
        Every stack the cockpit can name (§3), with its CLI command and, where it can start
        it on this host, the exact command the start job runs.
      tags:
      - env
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/env/start:
    post:
      operationId: env_start_create
      description: |-
        Start a mode as a job. A running stack → 409 with it, unless ``switch`` (stop and
        switch, §3.1): then the job runs `make down` first.
      tags:
      - env
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StartRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StartRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/env/state:
    get:
      operationId: env_state_retrieve
      tags:
      - env
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/env/stop:
    post:
      operationId: env_stop_create
      description: '`make down` as a job. REAL needs ``confirm: true`` (§9.1).'
      tags:
      - env
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StopRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StopRequestRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/env/viewers:
    get:
      operationId: env_viewers_retrieve
      tags:
      - env
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/jobs:
    get:
      operationId: jobs_list
      tags:
      - jobs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: jobs_create
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JobRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/jobs/{job_id}:
    get:
      operationId: jobs_retrieve
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/jobs/{job_id}/cancel:
    post:
      operationId: jobs_cancel_create
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/jobs/{job_id}/log:
    get:
      operationId: jobs_log_retrieve
      description: The whole log as text (download).
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
          description: ''
  /api/logs:
    get:
      operationId: logs_retrieve
      description: |-
        Search the log buffer: ``source`` (repeat or comma-separated; ``container:`` is a
        prefix), ``level`` (minimum), ``node``, ``q`` (text, or a regex with ``regex=1``),
        ``from`` / ``to`` / ``before`` (ISO 8601), ``limit``; ``download=1``: as a text file
        (``format`` is DRF's renderer switch, hence another name).
      tags:
      - logs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
            text/plain:
              schema:
                type: string
          description: ''
  /api/logs/sources:
    get:
      operationId: logs_sources_retrieve
      tags:
      - logs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/metrics/containers:
    get:
      operationId: metrics_containers_retrieve
      tags:
      - metrics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/metrics/host:
    get:
      operationId: metrics_host_retrieve
      description: Host CPU / memory / disk from run_monitor (1 Hz); computed here
        when it does not run.
      tags:
      - metrics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/platform:
    get:
      operationId: platform_retrieve
      tags:
      - platform
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/recordings:
    get:
      operationId: recordings_retrieve
      tags:
      - recordings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/ros/graph:
    get:
      operationId: ros_graph_retrieve
      description: Nodes, topics (type, publishers, subscribers), services, actions;
        from the agent.
      tags:
      - ros
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/ros/node/{name}/params:
    get:
      operationId: ros_node_params_retrieve
      parameters:
      - in: path
        name: name
        schema:
          type: string
        required: true
      tags:
      - ros
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/ros/topic/rate:
    get:
      operationId: ros_topic_rate_retrieve
      description: Measures one topic's rate for ``seconds`` (default 2), like `ros2
        topic hz`.
      tags:
      - ros
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/runs/{run_id}:
    get:
      operationId: runs_retrieve
      parameters:
      - in: path
        name: run_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - runs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/runs/{run_id}/abort:
    post:
      operationId: runs_abort_create
      description: Abort = cancel the goal + hold (the agent), and cancel the run's
        job.
      parameters:
      - in: path
        name: run_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - runs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/runs/{run_id}/log:
    get:
      operationId: runs_log_retrieve
      parameters:
      - in: path
        name: run_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - runs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
          description: ''
  /api/runs/{run_id}/pause:
    post:
      operationId: runs_pause_create
      description: Pause before the next step (sequence), or resume.
      parameters:
      - in: path
        name: run_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - runs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseBodyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PauseBodyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PauseBodyRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/runs/compare:
    get:
      operationId: runs_compare_retrieve
      description: 'Two runs side by side (``a``, ``b``): steps, durations, evaluation,
        metrics.'
      tags:
      - runs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/scenarios:
    get:
      operationId: scenarios_list
      description: 'GET: every scenario with its last run. POST {yaml}: create (validated).'
      tags:
      - scenarios
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: scenarios_create
      description: 'GET: every scenario with its last run. POST {yaml}: create (validated).'
      tags:
      - scenarios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioYamlRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScenarioYamlRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScenarioYamlRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/scenarios/{scenario_id}:
    get:
      operationId: scenarios_retrieve
      parameters:
      - in: path
        name: scenario_id
        schema:
          type: string
        required: true
      tags:
      - scenarios
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    put:
      operationId: scenarios_update
      parameters:
      - in: path
        name: scenario_id
        schema:
          type: string
        required: true
      tags:
      - scenarios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioYamlRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScenarioYamlRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScenarioYamlRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    delete:
      operationId: scenarios_destroy
      parameters:
      - in: path
        name: scenario_id
        schema:
          type: string
        required: true
      tags:
      - scenarios
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/scenarios/{scenario_id}/duplicate:
    post:
      operationId: scenarios_duplicate_create
      parameters:
      - in: path
        name: scenario_id
        schema:
          type: string
        required: true
      tags:
      - scenarios
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/scenarios/{scenario_id}/export:
    get:
      operationId: scenarios_export_retrieve
      parameters:
      - in: path
        name: scenario_id
        schema:
          type: string
        required: true
      tags:
      - scenarios
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/yaml:
              schema:
                type: string
          description: ''
  /api/scenarios/{scenario_id}/reachability:
    post:
      operationId: scenarios_reachability_create
      description: |-
        IK for every move_pose target (§12.3 "Check reachability"); body ``yaml``: an unsaved
        text instead of the stored file. Needs a running stack (any sim mode).
      parameters:
      - in: path
        name: scenario_id
        schema:
          type: string
        required: true
      tags:
      - scenarios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioYamlRequest'
