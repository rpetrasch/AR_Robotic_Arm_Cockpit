components:
  schemas:
    AckManyRequestRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
        comment:
          type: string
      required:
      - ids
    AckRequestRequest:
      type: object
      properties:
        comment:
          type: string
    AuditEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ts:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: string
          maxLength: 150
        action:
          type: string
          maxLength: 64
        obj:
          type: string
          maxLength: 200
        ip:
          type: string
          maxLength: 64
        payload: {}
      required:
      - action
      - actor
      - id
      - ts
    AuditPage:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
      required:
      - count
      - results
    CredentialsRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - password
      - username
    ExportRequestRequest:
      type: object
      properties:
        session:
          type: string
          format: uuid
        format:
          $ref: '#/components/schemas/FormatEnum'
        run:
          type: string
          format: uuid
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
      required:
      - session
    FormatEnum:
      enum:
      - parquet
      - csv
      type: string
      description: |-
        * `parquet` - parquet
        * `csv` - csv
    JobRequestRequest:
      type: object
      properties:
        step_id:
          type: string
          minLength: 1
        params:
          type: object
          additionalProperties: {}
      required:
      - step_id
    Me:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        last_login:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - last_login
      - username
    Ok:
      type: object
      properties:
        ok:
          type: boolean
      required:
      - ok
    PackBodyRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            minLength: 1
      required:
      - ids
    PasswordChangeRequest:
      type: object
      properties:
        old_password:
          type: string
          minLength: 1
          maxLength: 256
        new_password:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - new_password
      - old_password
    PasswordResetRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - password
    PauseBodyRequest:
      type: object
      properties:
        paused:
          type: boolean
      required:
      - paused
    PreflightRequestRequest:
      type: object
      properties:
        action:
          type: string
          minLength: 1
    RecordingRequestRequest:
      type: object
      properties:
        recording:
          type: boolean
      required:
      - recording
    RunChecksRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            minLength: 1
    ScenarioRunRequestRequest:
      type: object
      properties:
        mode:
          type: string
        repeat:
          type: integer
        seed:
          type: integer
          nullable: true
        keep_scene:
          type: boolean
        record:
          type: boolean
    ScenarioYamlRequest:
      type: object
      properties:
        yaml:
          type: string
          minLength: 1
      required:
      - yaml
    SetupStatus:
      type: object
      properties:
        needed:
          type: boolean
          description: True while no user exists
        allowed:
          type: boolean
          description: True when the request comes from localhost
      required:
      - allowed
      - needed
    StartRequestRequest:
      type: object
      properties:
        mode:
          type: string
          minLength: 1
        lichtblick:
          type: boolean
        switch:
          type: boolean
      required:
      - mode
    StopRequestRequest:
      type: object
      properties:
        confirm:
          type: boolean
    UnpackApplyRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        decisions:
          type: object
          additionalProperties: {}
      required:
      - decisions
      - token
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        date_joined:
          type: string
          format: date-time
        last_login:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
